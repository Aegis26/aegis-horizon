kind = "web"
previewPath = "/"
title = "CRM Platform"
description = "A multi-tenant, feature-customizable CRM SaaS. Phase 1 foundation: Clerk authentication, organizations with role-based access control, feature entitlements enforced server-side, Stripe billing with tiered plans and a la carte features, and a React app shell with gated navigation and settings."
version = "1.0.0"
id = "artifacts/crm"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22444

[services.development]
run = "pnpm --filter @workspace/crm run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/crm", "run", "build" ]
serve = "static"
publicDir = "artifacts/crm/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22444"
BASE_PATH = "/"
