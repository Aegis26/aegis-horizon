openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant CRM SaaS API (Phase 1 foundation)
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: orgs
  - name: members
  - name: features
  - name: billing
  - name: crm
  - name: dashboard
  - name: storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Current user and their organizations (auto-provisions user + default org on first call)
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Not authenticated
  /orgs/{orgId}:
    get:
      operationId: getOrg
      tags: [orgs]
      summary: Org details (requires membership)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "403":
          description: Not a member
    patch:
      operationId: updateOrg
      tags: [orgs]
      summary: Update org name/plan (owner/admin)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdate"
      responses:
        "200":
          description: Updated org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
  /orgs/{orgId}/members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List org members
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: inviteMember
      tags: [members]
      summary: Invite a user by email with a role (admin+)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInvite"
      responses:
        "201":
          description: Created membership (or pending invite)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
  /orgs/{orgId}/members/{memberId}:
    patch:
      operationId: updateMemberRole
      tags: [members]
      summary: Change a member's role (admin+)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRoleUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: removeMember
      tags: [members]
      summary: Remove a member (admin+)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Removed
  /orgs/{orgId}/features:
    get:
      operationId: listFeatures
      tags: [features]
      summary: Feature entitlements for the org
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Entitlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeatureEntitlement"
    put:
      operationId: updateFeatures
      tags: [features]
      summary: Set the org's enabled features (owner/admin)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureSelection"
      responses:
        "200":
          description: Updated org
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
  /billing/catalog:
    get:
      operationId: getBillingCatalog
      tags: [billing]
      summary: Plans, included features, and a-la-carte feature prices
      responses:
        "200":
          description: Catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingCatalog"
  /orgs/{orgId}/billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe checkout session (owner/admin)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "503":
          description: Stripe not connected yet
  /orgs/{orgId}/dashboard:
    get:
      operationId: getOrgDashboard
      tags: [dashboard]
      summary: Org dashboard summary
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /orgs/{orgId}/usage:
    get:
      operationId: listUsageLogs
      tags: [dashboard]
      summary: Recent usage/activity log entries
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Usage logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsageLog"
  /orgs/{orgId}/accounts:
    get:
      operationId: listAccounts
      tags: [crm]
      summary: List accounts with search/filter (requires 'crm' feature; 403 otherwise)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Search by name, industry, location, or custom field values
        - name: industry
          in: query
          required: false
          schema: { type: string }
        - name: segmentId
          in: query
          required: false
          schema: { type: string }
          description: Filter by a saved segment's conditions
        - name: includeInactive
          in: query
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
        "403":
          description: Feature not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureGateError"
    post:
      operationId: createAccount
      tags: [crm]
      summary: Create an account
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetail"
  /orgs/{orgId}/accounts/bulk-import:
    post:
      operationId: bulkImportAccounts
      tags: [crm]
      summary: Bulk import accounts (and optional nested contacts)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportRequest"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
  /orgs/{orgId}/accounts/{accountId}:
    get:
      operationId: getAccount
      tags: [crm]
      summary: Account detail with related contacts and opportunities
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Account detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountWithRelations"
        "404":
          description: Not found
    patch:
      operationId: updateAccount
      tags: [crm]
      summary: Update an account
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountUpdate"
      responses:
        "200":
          description: Updated account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDetail"
    delete:
      operationId: deleteAccount
      tags: [crm]
      summary: Soft delete an account (sets is_active false)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/AccountId"
      responses:
        "204":
          description: Deleted
  /orgs/{orgId}/accounts/{accountId}/contacts:
    get:
      operationId: listContacts
      tags: [crm]
      summary: List contacts for an account
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Contacts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contact"
    post:
      operationId: createContact
      tags: [crm]
      summary: Create a contact under an account
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactCreate"
      responses:
        "201":
          description: Created contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
  /orgs/{orgId}/contacts/{contactId}:
    get:
      operationId: getContact
      tags: [crm]
      summary: Contact detail
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ContactId"
      responses:
        "200":
          description: Contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
        "404":
          description: Not found
    patch:
      operationId: updateContact
      tags: [crm]
      summary: Update a contact
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ContactId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactUpdate"
      responses:
        "200":
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contact"
    delete:
      operationId: deleteContact
      tags: [crm]
      summary: Soft delete a contact
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/ContactId"
      responses:
        "204":
          description: Deleted
  /orgs/{orgId}/accounts/{accountId}/activities:
    post:
      operationId: createActivity
      tags: [crm]
      summary: Log a note, call, or email against an account (append-only)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityCreate"
      responses:
        "201":
          description: Created activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
  /orgs/{orgId}/accounts/{accountId}/timeline:
    get:
      operationId: getAccountTimeline
      tags: [crm]
      summary: Unified chronological timeline of all activities for an account
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Timeline entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /orgs/{orgId}/activities/{activityId}/attach-file:
    post:
      operationId: attachFileToActivity
      tags: [crm]
      summary: Attach an uploaded file to an activity (and its account's files list)
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - name: activityId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachFileRequest"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
  /orgs/{orgId}/segments:
    get:
      operationId: listSegments
      tags: [crm]
      summary: List saved segments
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Segments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Segment"
    post:
      operationId: createSegment
      tags: [crm]
      summary: Create a saved segment with conditions
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentCreate"
      responses:
        "201":
          description: Created segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
  /orgs/{orgId}/segments/{segmentId}:
    patch:
      operationId: updateSegment
      tags: [crm]
      summary: Update a saved segment
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/SegmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentCreate"
      responses:
        "200":
          description: Updated segment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
    delete:
      operationId: deleteSegment
      tags: [crm]
      summary: Delete a saved segment
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/SegmentId"
      responses:
        "204":
          description: Deleted
  /orgs/{orgId}/segments/{segmentId}/preview:
    post:
      operationId: previewSegment
      tags: [crm]
      summary: Preview accounts matching a saved segment
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/SegmentId"
      responses:
        "200":
          description: Matching accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
  /orgs/{orgId}/segments/preview:
    post:
      operationId: previewSegmentConditions
      tags: [crm]
      summary: Preview accounts matching ad-hoc conditions (for the segment builder)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentConditions"
      responses:
        "200":
          description: Matching accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /orgs/{orgId}/opportunities:
    get:
      operationId: listOpportunities
      tags: [crm]
      summary: List opportunities (requires 'sales' feature; 403 otherwise)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Opportunities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"
        "403":
          description: Feature not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureGateError"
  /orgs/{orgId}/workflows:
    get:
      operationId: listWorkflows
      tags: [crm]
      summary: List automation workflows (requires 'automation' feature; 403 otherwise)
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200":
          description: Workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowStub"
        "403":
          description: Feature not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureGateError"
components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
    SegmentId:
      name: segmentId
      in: path
      required: true
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        clerkId: { type: string }
        email: { type: string }
        fullName: { type: ["string", "null"] }
    Me:
      type: object
      required: [user, orgs]
      properties:
        user:
          $ref: "#/components/schemas/User"
        orgs:
          type: array
          items:
            $ref: "#/components/schemas/OrgMembership"
    OrgMembership:
      type: object
      required: [org, role]
      properties:
        org:
          $ref: "#/components/schemas/Organization"
        role:
          type: string
          enum: [owner, admin, manager, user, viewer]
    Organization:
      type: object
      required: [id, name, slug, plan, enabledFeatures]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        plan:
          type: string
          enum: [essential, professional, enterprise, custom]
        enabledFeatures:
          type: array
          items: { type: string }
        stripeCustomerId: { type: ["string", "null"] }
        stripeSubscriptionId: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        plan:
          type: string
          enum: [essential, professional, enterprise, custom]
    Member:
      type: object
      required: [id, role, user]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [owner, admin, manager, user, viewer]
        user:
          $ref: "#/components/schemas/User"
        createdAt: { type: ["string", "null"] }
    MemberInvite:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        fullName: { type: string }
        role:
          type: string
          enum: [admin, manager, user, viewer]
    MemberRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, admin, manager, user, viewer]
    FeatureEntitlement:
      type: object
      required: [featureKey, enabled]
      properties:
        featureKey: { type: string }
        enabled: { type: boolean }
    FeatureSelection:
      type: object
      required: [features]
      properties:
        features:
          type: array
          items: { type: string }
    FeatureInfo:
      type: object
      required: [key, name, description, monthlyPriceCents, category]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        monthlyPriceCents: { type: integer }
        category: { type: string }
    PlanInfo:
      type: object
      required: [key, name, monthlyPriceCents, includedFeatures, description]
      properties:
        key:
          type: string
          enum: [essential, professional, enterprise]
        name: { type: string }
        description: { type: string }
        monthlyPriceCents: { type: integer }
        includedFeatures:
          type: array
          items: { type: string }
    BillingCatalog:
      type: object
      required: [plans, features, annualDiscountPercent]
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/PlanInfo"
        features:
          type: array
          items:
            $ref: "#/components/schemas/FeatureInfo"
        annualDiscountPercent: { type: integer }
    CheckoutRequest:
      type: object
      required: [interval]
      properties:
        plan:
          type: string
          enum: [essential, professional, enterprise, custom]
        features:
          type: array
          items: { type: string }
        seatCount: { type: integer, minimum: 1 }
        interval:
          type: string
          enum: [month, year]
    CheckoutSession:
      type: object
      required: [url]
      properties:
        url: { type: string }
    DashboardSummary:
      type: object
      required: [orgId, plan, memberCount, enabledFeatureCount, enabledFeatures, accountCount, opportunityCount, recentActivity]
      properties:
        orgId: { type: string }
        plan: { type: string }
        memberCount: { type: integer }
        enabledFeatureCount: { type: integer }
        enabledFeatures:
          type: array
          items: { type: string }
        accountCount: { type: integer }
        opportunityCount: { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/UsageLog"
    UsageLog:
      type: object
      required: [id, featureKey, action, createdAt]
      properties:
        id: { type: string }
        featureKey: { type: string }
        action: { type: string }
        userEmail: { type: ["string", "null"] }
        createdAt: { type: string }
    Account:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        industry: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        healthScore: { type: ["string", "null"] }
        riskLevel: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
    Opportunity:
      type: object
      required: [id, name, stage]
      properties:
        id: { type: string }
        accountId: { type: string }
