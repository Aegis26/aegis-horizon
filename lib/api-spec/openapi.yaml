      responses: { "200": { description: Agents, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AiAgent" } } } } } }
    post:
      operationId: createAgent
      tags: [agents]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/AiAgent" } } } } }
  /orgs/{orgId}/agents/{agentId}:
    patch:
      operationId: updateAgent
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentInput" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/AiAgent" } } } } }
    delete:
      operationId: deactivateAgent
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses: { "204": { description: Deactivated } }
  /orgs/{orgId}/agents/{agentId}/run:
    post:
      operationId: runAgent
      tags: [agents]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AgentRunRequest" } } } }
      responses: { "200": { description: Execution, content: { application/json: { schema: { $ref: "#/components/schemas/AgentExecution" } } } } }
  /orgs/{orgId}/agent-executions:
    get:
      operationId: listAgentExecutions
      tags: [agents]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses: { "200": { description: Agent audit, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/AgentExecution" } } } } } }
  /orgs/{orgId}/commands/process:
    post:
      operationId: processTextCommand
      tags: [commands]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CommandRequest" } } } }
      responses:
        "202": { description: Persisted interpretation; explicit confirmation required before any action, content: { application/json: { schema: { $ref: "#/components/schemas/CommandPendingResponse" } } } }
  /orgs/{orgId}/commands/{commandId}/confirm:
    post:
      operationId: confirmTextCommand
      tags: [commands]
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - { name: commandId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Exact persisted command executed once, content: { application/json: { schema: { $ref: "#/components/schemas/CommandResultResponse" } } } }
        "403": { description: Tasks feature required for schedule_call_task }
        "409": { description: Command was already processed or cannot be confirmed }
  /orgs/{orgId}/commands/history:
    get:
      operationId: listCommandHistory
      tags: [commands]
      parameters: [{ $ref: "#/components/parameters/OrgId" }]
      responses: { "200": { description: Current user command history, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/CommandHistoryEntry" } } } } } }
components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    AccountId:
      name: accountId
      in: path
      required: true
      schema:
        type: string
    ContactId:
      name: contactId
      in: path
      required: true
      schema:
        type: string
    SegmentId:
      name: segmentId
      in: path
      required: true
      schema:
        type: string
    OpportunityId:
      name: opportunityId
      in: path
      required: true
      schema:
        type: string
    LeadId:
      name: leadId
      in: path
      required: true
      schema:
        type: string
    RuleId:
      name: ruleId
      in: path
      required: true
      schema:
        type: string
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema:
        type: string
    TerritoryId:
      name: territoryId
      in: path
      required: true
      schema:
        type: string
  schemas:
    WorkflowInput:
      type: object
      required: [name, trigger, actions]
      properties:
        name: { type: string }
        description: { type: ["string", "null"] }
        trigger:
          type: object
          required: [type, entityType]
          properties:
            type: { type: string, enum: [record_created, field_change, time_based] }
            entityType: { type: string, enum: [lead, opportunity, account] }
            field: { type: string }
            schedule: { type: string, enum: [hourly, daily] }
        conditions:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field: { type: string }
              operator: { type: string, enum: [equals, not_equals, gt, gte, lt, lte, contains] }
              value: {}
        actions:
          type: array
          minItems: 1
          items:
            type: object
            required: [type, config]
            properties:
              type: { type: string, enum: [create_task, create_recommendation, create_opportunity, update_field] }
              config: { type: object, additionalProperties: true }
    Workflow:
      allOf:
        - $ref: "#/components/schemas/WorkflowInput"
        - type: object
          required: [id, active, version, createdAt]
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
            version: { type: integer }
            lastDryRunVersion: { type: ["integer", "null"] }
            createdAt: { type: string, format: date-time }
    AiBudgetStatus:
      type: object
      required: [consentEnabled, budget, used, remaining]
      properties:
        consentEnabled: { type: boolean }
        budget: { type: integer }
        used: { type: integer }
        remaining: { type: integer }
    CopilotSummary:
      type: object
      required: [summaryShort, nextBestAction, topics, sentiment, cached, generatedAt]
      properties:
        summaryShort: { type: string, description: Exactly two concise sentences }
        summaryLong: { type: ["string", "null"] }
        nextBestAction: { type: string }
        topics: { type: array, items: { type: string } }
        sentiment: { type: string, enum: [positive, neutral, negative] }
        cached: { type: boolean }
        generatedAt: { type: string, format: date-time }
    TaskInput:
      type: object
      required: [title]
      properties:
        accountId: { type: ["string", "null"], format: uuid }
        opportunityId: { type: ["string", "null"], format: uuid }
        title: { type: string }
        description: { type: ["string", "null"] }
        type: { type: ["string", "null"] }
        status: { type: string, enum: [open, in_progress, completed, cancelled] }
        priority: { type: string, enum: [low, medium, high] }
        assignedToUserId: { type: ["string", "null"], format: uuid }
        dueDate: { type: ["string", "null"], format: date }
        dueTime: { type: ["string", "null"] }
    Task:
      allOf:
        - $ref: "#/components/schemas/TaskInput"
        - type: object
          required: [id, title, createdAt]
          properties:
            id: { type: string, format: uuid }
            completedAt: { type: ["string", "null"], format: date-time }
            createdAt: { type: string, format: date-time }
    AgentInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string, enum: [lead_qualifier, follow_up_sequencer, renewal_monitor] }
        systemPrompt: { type: ["string", "null"] }
        config: { type: object, additionalProperties: true }
        active: { type: boolean }
        executionFrequency: { type: string, enum: [realtime, hourly, daily] }
    PredictionFactor:
      type: object
      required: [factor, weight, detail]
      properties:
        factor: { type: string }
        weight: { type: number }
        detail: { type: string }
    ChurnPrediction:
      type: object
      required: [id, orgId, accountId, version, riskScore, riskLevel, riskFactors, recommendedAction, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        version: { type: integer }
        riskScore: { type: string }
        riskLevel: { type: string, enum: [low, medium, high, critical] }
        riskFactors: { type: array, items: { $ref: "#/components/schemas/PredictionFactor" } }
        daysUntilChurn: { type: ["integer", "null"] }
        recommendedAction: { type: string }
        alertedAt: { type: ["string", "null"], format: date-time }
        resolvedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversionPrediction:
      type: object
      required: [id, orgId, leadId, conversionProbability, factors, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        conversionProbability: { type: string }
        predictedCloseDate: { type: ["string", "null"], format: date }
        factors: { type: array, items: { $ref: "#/components/schemas/PredictionFactor" } }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ClosePrediction:
      type: object
      required: [id, orgId, opportunityId, predictedProbability, baselineByStage, adjustmentFactors, confidence, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        opportunityId: { type: string, format: uuid }
        predictedProbability: { type: string }
        baselineByStage: { type: string }
        adjustmentFactors: { type: array, items: { $ref: "#/components/schemas/PredictionFactor" } }
        expectedCloseDate: { type: ["string", "null"], format: date }
        confidence: { type: string }
        updatedAt: { type: string, format: date-time }
    NextActionRecommendation:
      type: object
      required: [action, rationale, confidence]
      properties:
        action: { type: string }
        rationale: { type: string }
        confidence: { type: number }
    WorkflowActionResult:
      type: object
      required: [type, status]
      properties:
        type: { type: string, enum: [create_task, create_recommendation, create_opportunity, update_field] }
        status: { type: string, enum: [planned, skipped, success, failed] }
        result: { type: object, additionalProperties: true }
        config: { type: object, additionalProperties: true }
    WorkflowExecution:
      type: object
      required: [id, orgId, workflowId, idempotencyKey, triggerData, actionResults, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        workflowId: { type: string, format: uuid }
        idempotencyKey: { type: string }
        entityType: { type: ["string", "null"], enum: [lead, opportunity, account, null] }
        entityId: { type: ["string", "null"], format: uuid }
        triggerData: { type: object, additionalProperties: true }
        actionResults: { type: array, items: { $ref: "#/components/schemas/WorkflowActionResult" } }
        status: { type: string, enum: [pending, running, success, failed] }
        errorMessage: { type: ["string", "null"] }
        claimedAt: { type: ["string", "null"], format: date-time }
        executedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    WorkflowDryRun:
      type: object
      required: [dryRun, sideEffects, conditionsMatched, plannedActions]
      properties:
        dryRun: { type: boolean }
        sideEffects: { type: integer }
        conditionsMatched: { type: boolean }
        plannedActions: { type: array, items: { $ref: "#/components/schemas/WorkflowActionResult" } }
    AiAgent:
      type: object
      required: [id, orgId, name, type, config, tools, active, executionFrequency, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [lead_qualifier, follow_up_sequencer, renewal_monitor] }
        systemPrompt: { type: ["string", "null"] }
        config: { type: object, additionalProperties: true }
        tools: { type: array, items: { type: string } }
        active: { type: boolean }
        executionFrequency: { type: string, enum: [realtime, hourly, daily] }
        createdBy: { type: ["string", "null"], format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AgentExecutionAction:
      type: object
      required: [action]
      properties:
        action: { type: string }
        status: { type: string }
        score: { type: number }
        taskId: { type: ["string", "null"], format: uuid }
        opportunityId: { type: ["string", "null"], format: uuid }
        recommendationId: { type: ["string", "null"], format: uuid }
        sent: { type: boolean }
    AgentExecution:
      type: object
      required: [id, orgId, agentId, idempotencyKey, input, actions, status, tokensUsed, executedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        agentId: { type: string, format: uuid }
        idempotencyKey: { type: string }
        entityType: { type: ["string", "null"] }
        entityId: { type: ["string", "null"], format: uuid }
        input: { type: object, additionalProperties: true }
        decisionRationale: { type: ["string", "null"] }
        actions: { type: array, items: { $ref: "#/components/schemas/AgentExecutionAction" } }
        output: { type: ["string", "null"] }
        status: { type: string, enum: [running, success, partial, failed] }
        tokensUsed: { type: integer }
        executedAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
    ParsedCommandAction:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [query_largest_open_deal, schedule_call_task] }
        date: { type: string, format: date }
        time: { type: string }
    CommandInterpretation:
      type: object
      required: [commands]
      properties:
        commands: { type: array, items: { $ref: "#/components/schemas/ParsedCommandAction" } }
    CommandDeal:
      type: object
      required: [id, name, value, stage]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        value: { type: ["string", "null"] }
        stage: { type: string }
    CommandResult:
      type: object
      required: [largestOpenDeal]
      properties:
        largestOpenDeal: { anyOf: [{ $ref: "#/components/schemas/CommandDeal" }, { type: "null" }] }
        scheduledTask: { $ref: "#/components/schemas/Task" }
    CommandPendingResponse:
      type: object
      required: [commandId, requiresConfirmation, interpretation]
      properties:
        commandId: { type: string, format: uuid }
        requiresConfirmation: { type: boolean }
        interpretation: { $ref: "#/components/schemas/CommandInterpretation" }
    CommandResultResponse:
      type: object
      required: [commandId, confirmationRequired, result]
      properties:
        commandId: { type: string, format: uuid }
        confirmationRequired: { type: boolean }
        result: { $ref: "#/components/schemas/CommandResult" }
    CommandHistoryEntry:
      type: object
      required: [id, orgId, userId, transcript, status, confirmationRequired, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        transcript: { type: string }
        interpretation: { anyOf: [{ $ref: "#/components/schemas/CommandInterpretation" }, { type: "null" }] }
        action: { type: ["string", "null"] }
        status: { type: string, enum: [processing, awaiting_confirmation, executing, completed, failed] }
        confirmationRequired: { type: boolean }
        result: { anyOf: [{ $ref: "#/components/schemas/CommandResult" }, { type: "null" }] }
        errorMessage: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
    EntityRunRequest:
      type: object
      required: [entityType, entityId]
      properties:
        entityType: { type: string, enum: [lead, opportunity, account] }
        entityId: { type: string, format: uuid }
    ToggleRequest:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    CopilotSummarizeRequest:
      type: object
      required: [entityType, entityId]
      properties:
        entityType: { type: string, enum: [account, opportunity, email_thread] }
        entityId: { type: string, format: uuid }
        style: { type: string, enum: [short, long], default: short }
    AccountIdRequest:
      type: object
      required: [accountId]
      properties:
        accountId: { type: string, format: uuid }
    EmailDraftRequest:
      type: object
      required: [accountId, context]
      properties:
        accountId: { type: string, format: uuid }
        context: { type: string }
        tone: { type: string, enum: [professional, casual] }
    AgentRunRequest:
      type: object
      required: [entityType, entityId]
      properties:
        entityType: { type: string, enum: [lead, account, opportunity] }
        entityId: { type: string, format: uuid }
    CommandRequest:
      type: object
      required: [transcript]
      properties:
        transcript: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    User:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        clerkId: { type: string }
        email: { type: string }
        fullName: { type: ["string", "null"] }
    Me:
      type: object
      required: [user, orgs]
      properties:
        user:
          $ref: "#/components/schemas/User"
        orgs:
          type: array
          items:
            $ref: "#/components/schemas/OrgMembership"
    OrgMembership:
      type: object
      required: [org, role]
      properties:
        org:
          $ref: "#/components/schemas/Organization"
        role:
          type: string
          enum: [owner, admin, manager, user, viewer]
    Organization:
      type: object
      required: [id, name, slug, plan, enabledFeatures]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        plan:
          type: string
          enum: [essential, professional, enterprise, custom]
        enabledFeatures:
          type: array
          items: { type: string }
        stripeCustomerId: { type: ["string", "null"] }
        stripeSubscriptionId: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
    OrganizationUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        plan:
          type: string
          enum: [essential, professional, enterprise, custom]
    Member:
      type: object
      required: [id, role, user]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [owner, admin, manager, user, viewer]
        user:
          $ref: "#/components/schemas/User"
        createdAt: { type: ["string", "null"] }
    MemberInvite:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        fullName: { type: string }
        role:
          type: string
          enum: [admin, manager, user, viewer]
    MemberRoleUpdate:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, admin, manager, user, viewer]
    FeatureEntitlement:
      type: object
      required: [featureKey, enabled]
      properties:
        featureKey: { type: string }
        enabled: { type: boolean }
    FeatureSelection:
      type: object
      required: [features]
      properties:
        features:
          type: array
          items: { type: string }
    FeatureInfo:
      type: object
      required: [key, name, description, monthlyPriceCents, category]
      properties:
        key: { type: string }
        name: { type: string }
        description: { type: string }
        monthlyPriceCents: { type: integer }
        category: { type: string }
    PlanInfo:
      type: object
      required: [key, name, monthlyPriceCents, includedFeatures, description]
      properties:
        key:
          type: string
          enum: [essential, professional, enterprise]
        name: { type: string }
        description: { type: string }
        monthlyPriceCents: { type: integer }
        includedFeatures:
          type: array
          items: { type: string }
    BillingCatalog:
      type: object
      required: [plans, features, annualDiscountPercent]
      properties:
        plans:
          type: array
          items:
            $ref: "#/components/schemas/PlanInfo"
        features:
          type: array
          items:
            $ref: "#/components/schemas/FeatureInfo"
        annualDiscountPercent: { type: integer }
    CheckoutRequest:
      type: object
      required: [interval]
      properties:
        plan:
          type: string
          enum: [essential, professional, enterprise, custom]
        features:
          type: array
          items: { type: string }
        seatCount: { type: integer, minimum: 1 }
        interval:
          type: string
          enum: [month, year]
    CheckoutSession:
      type: object
      required: [url]
      properties:
        url: { type: string }
    DashboardSummary:
      type: object
      required: [orgId, plan, memberCount, enabledFeatureCount, enabledFeatures, accountCount, opportunityCount, recentActivity]
      properties:
        orgId: { type: string }
        plan: { type: string }
        memberCount: { type: integer }
        enabledFeatureCount: { type: integer }
        enabledFeatures:
          type: array
          items: { type: string }
        accountCount: { type: integer }
        opportunityCount: { type: integer }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/UsageLog"
    UsageLog:
      type: object
      required: [id, featureKey, action, createdAt]
      properties:
        id: { type: string }
        featureKey: { type: string }
        action: { type: string }
        userEmail: { type: ["string", "null"] }
        createdAt: { type: string }
    Account:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        industry: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        healthScore: { type: ["string", "null"] }
        riskLevel: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
    Opportunity:
      type: object
      required: [id, name, stage]
      properties:
        id: { type: string }
        accountId: { type: string }
        name: { type: string }
        stage: { type: string }
        probability: { type: ["number", "null"] }
        value: { type: ["string", "null"] }
        expectedCloseDate: { type: ["string", "null"] }
        forecastCategory: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }
    FeatureGateError:
      type: object
      required: [error, featureKey]
      properties:
        error: { type: string }
        featureKey: { type: string }
    FileAttachment:
      type: object
      required: [objectPath, name]
      properties:
        objectPath: { type: string }
        name: { type: string }
        size: { type: ["integer", "null"] }
        contentType: { type: ["string", "null"] }
        uploadedAt: { type: ["string", "null"] }
    AccountDetail:
      type: object
      required: [id, name, isActive]
      properties:
        id: { type: string }
        name: { type: string }
        industry: { type: ["string", "null"] }
        website: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        country: { type: ["string", "null"] }
        zip: { type: ["string", "null"] }
        annualRevenue: { type: ["string", "null"] }
        employeeCount: { type: ["integer", "null"] }
        healthScore: { type: ["string", "null"] }
        riskLevel: { type: ["string", "null"] }
        ltv: { type: ["string", "null"] }
        nextRenewalDate: { type: ["string", "null"] }
        isActive: { type: boolean }
        metadata: { type: object, additionalProperties: true }
        files:
          type: array
